# The URL the site will be built for
base_url = "https://vivek-anand.xyz/"
title = "Vivek Anand"

# Whether to automatically compile all Sass files in the sass directory
compile_sass = true

# Whether to build a search index to be used later on by a JavaScript library
build_search_index = true

# Build inputs and helper files that live next to posts but should NOT be treated
# as Zola pages or copied into the published site. The typst shortcode reads
# content.html from the source tree via load_data, so it does not need copying;
# a stray .md with no front matter would otherwise break the whole build.
ignored_content = [
    "**/content.typ",
    "**/content.html",
    "**/refs.bib",
    "**/content.pdf",
    "**/figures/*.py",
    "**/figures/*.md",
    "**/figures/*.typ",
    "**/figures/*.html",
    "**/__pycache__/**",
]

# Enable tags taxonomy
taxonomies = [
    { name = "tags", feed = true }
]

[markdown]
# Whether to do syntax highlighting
# Theme can be customised by setting the `highlight_theme` variable to a theme supported by Zola
highlight_code = true

